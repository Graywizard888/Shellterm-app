name: Edge mirror

# The Cloudflare Worker in edge/ that serves the packages from a nearby server (see edge/README.md).
# Pull requests only run its tests; a merge to main deploys it, when the Cloudflare secrets are set.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "edge/**"
      - ".github/workflows/edge.yml"
  pull_request:
    paths:
      - "edge/**"
      - ".github/workflows/edge.yml"

permissions:
  contents: read

jobs:
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v7

      - name: Test the Worker
        run: node --test

      - name: Deploy the Worker
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not set: skipping the deploy (see edge/README.md)"
            exit 0
          fi
          npx --yes wrangler@4 deploy
