name: Packages

# Takes the packages of Termux's repositories and renames the app inside them (com.termux -> com.gwterm; same length,
# so the binaries stay valid). Nothing is compiled.
#   main   3,000+ packages, 9.5 GB: what pkg uses by default      -> releases apt-1 .. apt-4
#   x11    graphical programs, 5.5 GB (pkg install x11-repo)       -> releases apt-x11-1, apt-x11-2
#   root   programs for rooted phones, 0.2 GB (pkg install root-repo) -> release apt-root-1
# Each lot is its own job (a release holds at most 1,000 files, a runner about 14 GB of disk). The x11 and root
# repositories are opt-in, as in Termux: the packages that switch them on are rewritten to point at these releases.
# (TUR, the community repository, is not hosted: its index names many files that are gone.)
#
# Where things go (when the workflow is started by hand with "Run workflow", and every Monday at 03:23 UTC):
#   the releases above     the patched .deb files, each lot with a flat apt index (Packages, Packages.gz,
#                          Packages.xz, Release). Created once, afterwards only their files are replaced.
#   release bootstrap      Termux's bootstrap zip patched for this app, with apt pointed at apt-1 .. apt-4
#                          (the app's fallback when Termux's own download fails).
#   R2 bucket (optional)   a second copy of main (apt-1 .. apt-4) and of the bootstrap, served by the edge mirror in
#                          edge/ from a nearby Cloudflare server. Skipped when the R2 secrets are not set; see
#                          edge/README.md.
#
# On a pull request the same work is done as a check: every package is downloaded, patched, verified and deleted
# again, and nothing is published. Packages are checked for the old name in paths, content and checksums, PAX tar
# headers dpkg refuses, and that dpkg itself can read and unpack them.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"
  pull_request:
    paths:
      - "packages/**"
      - ".github/workflows/packages.yml"

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  shard:
    name: ${{ matrix.repo }} ${{ matrix.shard }} of ${{ matrix.shards }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # Publishing spends the token's 5,000 requests an hour, shared by every lot (about 4,000 in all). Two lots at a
      # time keep the run inside one window; a pull request only checks and sends nothing, so it runs all at once.
      max-parallel: ${{ github.event_name == 'pull_request' && 7 || 2 }}
      matrix:
        # Keep in step with SOURCE_REPOS in packages/patch_termux.py (a unit test compares the release names).
        include:
          - {repo: main, shard: 1, shards: 4, tag: apt-1}
          - {repo: main, shard: 2, shards: 4, tag: apt-2}
          - {repo: main, shard: 3, shards: 4, tag: apt-3}
          - {repo: main, shard: 4, shards: 4, tag: apt-4}
          - {repo: x11, shard: 1, shards: 2, tag: apt-x11-1}
          - {repo: x11, shard: 2, shards: 2, tag: apt-x11-2}
          - {repo: root, shard: 1, shards: 1, tag: apt-root-1}
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev xz-utils

      - name: Test the patcher
        run: python3 -m unittest discover -s packages -v

      # With a pull request every package is deleted right after it is checked, so the disk never fills. When
      # publishing, the patched files are kept for the upload (about 2.4 GB per lot).
      - name: Patch and check this lot
        env:
          PUBLISH: ${{ github.event_name != 'pull_request' }}
        run: |
          flags=(--check)
          [ "$PUBLISH" = true ] || flags+=(--discard)
          python3 packages/patch_termux.py repo --all --repo-name "${{ matrix.repo }}" \
            --shard "${{ matrix.shard }}/${{ matrix.shards }}" \
            --release-base "https://github.com/$GITHUB_REPOSITORY/releases/download" \
            --jobs "$(nproc)" "${flags[@]}" \
            --out work/debs --scratch "$RUNNER_TEMP/scratch" --report work/report.jsonl

      - name: Summary
        if: always()
        run: |
          [ -f work/report.jsonl ] || exit 0
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json
          rows = [json.loads(line) for line in open("work/report.jsonl")]
          bad = [r for r in rows if r["problems"]]
          warn = [r for r in rows if r["warnings"]]
          print(f"### ${{ matrix.repo }}, lot ${{ matrix.shard }} of ${{ matrix.shards }}")
          print(f"- {len(rows)} packages, {sum(r['size'] for r in rows) / 1e6:.0f} MB downloaded, "
                f"{sum(r.get('patched_size', 0) for r in rows) / 1e6:.0f} MB patched")
          print(f"- {len(bad)} with problems, {len(warn)} with warnings")
          for r in bad:
              for problem in r["problems"][:5]:
                  print(f"  - problem: {problem}")
          for r in warn:
              for warning in r["warnings"][:5]:
                  print(f"  - warning: {warning}")
          EOF

      - name: Make the flat apt repository
        if: github.event_name != 'pull_request'
        run: bash packages/make-flat-repo.sh work/debs

      # The release is rebuilt from scratch each run: files of packages that are gone from Termux are removed,
      # everything else is replaced. Up to 1,000 files fit in one release; a lot has about 760.
      # The workflow's own token may make about 1,000 API requests an hour for the whole repository, and every uploaded
      # file is one: the seven lots together send about 4,000. Add a personal access token as the repository secret
      # PACKAGES_TOKEN (see the README) and it is used instead, with 5,000 an hour of its own. Either way only files
      # that changed are sent, and when the limit is reached the script waits for it to reset (up to 95 minutes) and carries on.
      - name: Publish release ${{ matrix.tag }}
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
        run: |
          tag="${{ matrix.tag }}"
          python3 packages/publish_release.py "$tag" work/debs \
            "Packages ${{ matrix.repo }} ${{ matrix.shard }} of ${{ matrix.shards }}" \
            "Lot ${{ matrix.shard }} of ${{ matrix.shards }} of the ${{ matrix.repo }} packages of the Shellterm package repository: Termux's packages renamed for com.gwterm, as a flat apt repository. apt reads it with: deb [trusted=yes] https://github.com/$GITHUB_REPOSITORY/releases/download/$tag /  The files are replaced by every run of the Packages workflow; this release is never recreated."
          echo "Released: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"

      # The copy behind the edge mirror (edge/README.md). Only main: it is 9.5 GB and fits R2's free 10 GB, and the copy
      # never takes the bucket over 9.5 GB (a lot that would is skipped with a warning). It runs
      # after the GitHub release, which stays the source of truth: the Worker falls back to it for a file R2 lacks.
      - name: Copy to R2 ${{ matrix.tag }}
        if: github.event_name != 'pull_request' && matrix.repo == 'main'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_MAX_BYTES: ${{ vars.R2_MAX_BYTES }}
        run: python3 packages/sync_r2.py "${{ matrix.tag }}" work/debs

  bootstrap:
    name: Bootstrap
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Download Termux's bootstrap
        run: |
          mkdir -p work
          curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors -o work/stock-bootstrap.zip \
            https://github.com/termux/termux-packages/releases/latest/download/bootstrap-aarch64.zip

      - name: Patch the bootstrap
        run: |
          args=()
          for k in 1 2 3 4; do
            args+=(--flat-repo "https://github.com/$GITHUB_REPOSITORY/releases/download/apt-$k")
          done
          python3 packages/patch_termux.py bootstrap --stock work/stock-bootstrap.zip \
            --out out/bootstrap-aarch64.zip "${args[@]}"

      # Fails the run if any trace of the old name or any stale checksum is left.
      - name: Verify
        run: python3 packages/patch_termux.py verify --bootstrap out/bootstrap-aarch64.zip

      - name: Publish the bootstrap release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view bootstrap > /dev/null 2>&1 || \
            gh release create bootstrap --title "Base system" --notes "Patched copy of Termux's bootstrap, the app's fallback. Built by the Packages workflow." --prerelease
          gh release upload bootstrap out/bootstrap-aarch64.zip out/bootstrap-aarch64.zip.sha256 --clobber

      - name: Copy the bootstrap to R2
        if: github.event_name != 'pull_request'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_MAX_BYTES: ${{ vars.R2_MAX_BYTES }}
        run: python3 packages/sync_r2.py bootstrap out
